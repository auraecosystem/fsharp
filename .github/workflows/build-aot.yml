name: Build Native AOT Binaries

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-aot:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
            artifact_name: aura-node-linux-x64
            binary_name: aura-node
            archive_cmd: tar -czvf aura-node-linux-x64.tar.gz aura-node
            archive_name: aura-node-linux-x64.tar.gz

          - target: win-x64
            os: windows-latest
            artifact_name: aura-node-win-x64
            binary_name: aura-node.exe
            archive_cmd: Compress-Archive -Path aura-node.exe -DestinationPath aura-node-win-x64.zip
            archive_name: aura-node-win-x64.zip

          - target: osx-arm64
            os: macos-latest
            artifact_name: aura-node-osx-arm64
            binary_name: aura-node
            archive_cmd: tar -czvf aura-node-osx-arm64.tar.gz aura-node
            archive_name: aura-node-osx-arm64.tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Linux requires C++ build dependencies (clang/zlib) for Native AOT linking
      - name: Install Linux Build Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev build-essential

      - name: Restore Dependencies
        run: dotnet restore

      - name: Publish Native AOT Executable
        run: >
          dotnet publish ./AuraNode.fsproj
          -c Release
          -r ${{ matrix.target }}
          --self-contained true
          -p:PublishAot=true
          -o ./publish

      - name: Package Binary Artifact (POSIX)
        if: runner.os != 'Windows'
        run: |
          cd ./publish
          chmod +x ${{ matrix.binary_name }}
          ${{ matrix.archive_cmd }}

      - name: Package Binary Artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-Location ./publish
          ${{ matrix.archive_cmd }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ./publish/${{ matrix.archive_name }}
          if-no-files-found: error
